[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automacao-web"
version = "0.1.0"
description = "Fachada em pt-br sobre o Selenium, para RPA e automação web reaproveitável entre projetos."
requires-python = ">=3.10"
authors = [{ email = "jvabreucunhapc@gmail.com" }]
dependencies = [
    "selenium>=4.15.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["automacao_web"]
