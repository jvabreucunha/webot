[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webot"
version = "0.2.0"
description = "Abstração em pt-br sobre o Selenium, para RPA e automação web reaproveitável entre projetos."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ email = "jvabreucunhapc@gmail.com" }]
dependencies = [
    "selenium>=4.15.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
empacotar = [
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["webot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
